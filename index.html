<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SF作品に登場するような宇宙インフラを物理モデルで計算するシミュレータ" />
    <title>SFインフラシミュレータ</title>
    <script>
      // 画面の色（src/app/theme.ts）。読み込み中に色が切り替わって見えないよう、描画の前に決める
      try {
        var s = localStorage.getItem('sf-theme')
        var light = s === 'light' || (s !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
